name = "closerice-api"
main = "index.ts"
compatibility_date = "2026-05-22"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
PUBLIC_SITE_URL = "https://bennycheung1019.github.io/closerice/"
ALLOWED_ORIGIN = "https://bennycheung1019.github.io"

[[d1_databases]]
binding = "DB"
database_name = "closerice"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "../drizzle"
